# Example values for a single-replica Kubernetes deployment. Replace all documentation
# hostnames, addresses, credentials, and image pins before using this file.
replicaCount: 1
fullnameOverride: guest-wall

image:
  repository: ghcr.io/egekocabas/guest-wall
  tag: main
  digest: ""
  pullPolicy: IfNotPresent

printerAgent:
  url: http://192.0.2.10:8000
  timeoutSeconds: 30

app:
  publicHost: guest-wall.example.com

ingress:
  lan:
    enabled: true
    host: guest-wall.home.example.com
  public:
    enabled: true
    host: guest-wall.example.com

admin:
  basicAuthSecret: guest-wall-admin-basic-auth

persistence:
  enabled: true
  storageClass: local-path
  size: 10Gi

networkPolicy:
  enabled: true
  printerAgent:
    enabled: true
    cidr: 192.0.2.10/32
    port: 8000

serviceMonitor:
  enabled: true
