[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "guestwall"
version = "0.1.0"
description = "Self-hosted thermal photo guest wall"
license = "MIT"
authors = [{ name = "Ege Kocabas" }]
requires-python = ">=3.12"
dependencies = [
  "alembic==1.20.1",
  "fastapi==0.162.0",
  "httpx==0.28.1",
  "Pillow==13.0.0",
  "pillow-heif==1.8.1",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.16.2",
  "python-multipart==0.0.33",
  "sqlalchemy==2.1.8",
  "uvicorn[standard]==0.54.0",
]

[project.urls]
Homepage = "https://github.com/egekocabas/guest-wall"
Repository = "https://github.com/egekocabas/guest-wall"
Issues = "https://github.com/egekocabas/guest-wall/issues"

[project.optional-dependencies]
dev = [
  "mypy==2.4.1",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["guestwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"guestwall/api/routes.py" = ["B008"] # FastAPI dependency declarations are evaluated defaults.
"tools/mock_printer.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["guestwall"]
exclude = ["migrations"]
