[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "guestwall"
version = "0.1.0"
description = "Self-hosted thermal photo guest wall"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["guestwall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"guestwall/api/routes.py" = ["B008"] # FastAPI dependency declarations are evaluated defaults.
"tools/mock_printer.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["guestwall"]
exclude = ["migrations"]
