{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "guest-wall.fullname" . }}
  labels:
    {{- include "guest-wall.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "guest-wall.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range .Values.networkPolicy.ingressNamespaceNames }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
    {{- range .Values.networkPolicy.metricsNamespaceNames }}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if .Values.networkPolicy.printerAgent.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.printerAgent.cidr }}
      ports:
        - port: {{ .Values.networkPolicy.printerAgent.port }}
          protocol: TCP
    {{- end }}
{{- end }}

