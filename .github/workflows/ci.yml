name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e 'backend[dev]'
      - run: ruff format --check backend
      - run: ruff check backend
      - run: mypy backend/guestwall
      - run: pytest backend --cov=guestwall --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.2.4
      - run: helm lint chart/guest-wall
      - run: >-
          helm template guest-wall chart/guest-wall
          --set ingress.lan.enabled=true
          --set ingress.lan.host=guest-wall.home.example.com
          --set ingress.public.enabled=true
          --set ingress.public.host=guest-wall.example.com
          --set app.publicHost=guest-wall.example.com
          --set admin.basicAuthSecret=guest-wall-admin-basic-auth
          > /tmp/guest-wall-manifests.yaml
      - run: >-
          grep -Fq 'MAX_UPLOAD_BYTES: "20971520"'
          /tmp/guest-wall-manifests.yaml
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
