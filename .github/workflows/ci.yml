name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install --upgrade pip && pip install -e 'backend[dev]'
      - run: ruff format --check backend
      - run: ruff check backend
      - run: mypy backend/guestwall
      - run: pytest backend --cov=guestwall --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: helm lint chart/guest-wall
      - run: >-
          helm template guest-wall chart/guest-wall
          --set ingress.lan.enabled=true
          --set ingress.lan.host=guest-wall.home.example.com
          --set ingress.public.enabled=true
          --set ingress.public.host=guest-wall.example.com
          --set app.publicHost=guest-wall.example.com
          --set admin.basicAuthSecret=guest-wall-admin-basic-auth
          > /tmp/guest-wall-manifests.yaml
      - run: >-
          grep -Fq 'MAX_UPLOAD_BYTES: "20971520"'
          /tmp/guest-wall-manifests.yaml
